
<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b09">
<title>SABI SMS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b09;color:#f4fff8;
font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
header{padding:22px;border-bottom:1px solid #26382c}
.logo{font-size:25px;font-weight:900}
.logo span{color:#00ef87}
main{max-width:500px;margin:35px auto;padding:18px}
h1{font-size:38px;margin:10px 0}
p{color:#9daaa1;line-height:1.6}
.panel{background:#101711;border:1px solid #2a4030;
border-radius:20px;padding:22px}
label{display:block;margin:17px 0 8px;font-size:14px}
input,textarea{width:100%;padding:15px;background:#080d09;
color:white;border:1px solid #354b39;border-radius:11px;font:inherit}
textarea{min-height:125px;resize:vertical}
button{width:100%;padding:16px;margin-top:18px;border:0;
border-radius:11px;background:#00ef87;color:#05160c;
font-weight:800;font-size:15px}
.check{display:flex;gap:10px;align-items:start;font-size:12px;
color:#b4c3b7;line-height:1.5;margin-top:16px}
.check input{width:auto;margin-top:3px}
#result{font-size:13px;overflow-wrap:anywhere;margin-top:18px}
small{color:#85938a;line-height:1.6;display:block;margin-top:15px}
</style>
</head>
<body>
<header><div class="logo">SABI<span>SMS</span></div></header>
<main>
  <p style="color:#00ef87;letter-spacing:2px">PERSONAL MESSAGING</p>
  <h1>Dërgo SMS.</h1>
  <p>Shkruaj numrin shqiptar dhe mesazhin tënd.</p>

  <section class="panel">
    <form id="form">
      <label for="password">Fjalëkalimi privat</label>
      <input id="password" type="password" required
        autocomplete="current-password" placeholder="Fjalëkalimi yt">

      <label for="phone">Numri shqiptar</label>
      <input id="phone" type="tel" required
        inputmode="numeric" placeholder="06XXXXXXXX ose 3556XXXXXXXX">

      <label for="text">Mesazhi</label>
      <textarea id="text" required maxlength="1000"
        placeholder="Shkruaj mesazhin..."></textarea>

      <label class="check">
        <input id="confirm" type="checkbox" required>
        <span>Konfirmoj se kam të drejtë t'i dërgoj mesazh këtij numri.</span>
      </label>

      <button id="send" type="submit">DËRGO SMS →</button>
      <div id="result" role="status"></div>
      <small>Mesazhet mund të kenë kosto. Mos e dërgo
      fjalëkalimin apo kredencialet API te persona të tjerë.</small>
    </form>
  </section>
</main>

<script>
const form = document.getElementById("form");
const result = document.getElementById("result");
const button = document.getElementById("send");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  let phone = document.getElementById("phone").value
    .replace(/[\s()+-]/g, "");

  if (phone.startsWith("0")) phone = "355" + phone.slice(1);

  if (!/^3556\d{8}$/.test(phone)) {
    result.textContent = "Kontrollo numrin shqiptar.";
    result.style.color = "#ff9292";
    return;
  }

  button.disabled = true;
  button.textContent = "DUKE DËRGUAR...";
  result.textContent = "Po kontaktohet serveri...";
  result.style.color = "#00ef87";

  try {
    const response = await fetch("/api/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        password: document.getElementById("password").value,
        phone,
        text: document.getElementById("text").value.trim(),
        confirm: document.getElementById("confirm").checked
      })
    });

    const data = await response.json();
    result.textContent = data.ok
      ? data.message + (data.messageId ? " ID: " + data.messageId : "")
      : data.error || "Dërgimi dështoi.";

    result.style.color = data.ok ? "#00ef87" : "#ff9292";
  } catch {
    result.textContent =
      "Nuk u lidh dot me serverin. Kontrollo konfigurimin.";
    result.style.color = "#ff9292";
  } finally {
    button.disabled = false;
    button.textContent = "DËRGO SMS →";
  }
});
</script>
</body>
</html>
